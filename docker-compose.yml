services:
  omop-bridge-db:
    image: ${DB_IMAGE:-omop-bridge-db:local}
    container_name: omop-bridge-db
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-omop}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-omop}
      POSTGRES_DB: ${TARGET_DB_NAME:-omop_cdm}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    ports:
      - "5433:5432"
    volumes:
      - omopbridge_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TARGET_DB_USER:-omop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - omop-bridge-network

  backend:
    image: ${BACKEND_IMAGE:-omop-bridge-backend:local}
    container_name: omop-bridge-backend
    restart: unless-stopped
    env_file: .env
    environment:
      TARGET_DB_HOST: omop-bridge-db
      TARGET_DB_PORT: 5432
      R_RUNNER_URL: http://r-runner:8001
      HF_TOKEN: ${HF_TOKEN}
      FAISS_INDEX_DIR: /app/data/faiss_indexes
    extra_hosts:
      - "localhost:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      omop-bridge-db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - dqd_results:/results
      - ./faiss_indexes:/app/data/faiss_indexes
    networks:
      - omop-bridge-network

  r-runner:
    image: ${R_RUNNER_IMAGE:-omop-bridge-r-runner:local}
    container_name: omop-bridge-r-runner
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "3000:3000"
    environment:
      TARGET_DB_HOST: omop-bridge-db
      TARGET_DB_PORT: 5432
      TARGET_DB_USER: ${TARGET_DB_USER:-omop}
      TARGET_DB_PASSWORD: ${TARGET_DB_PASSWORD:-omop}
      TARGET_DB_NAME: ${TARGET_DB_NAME:-omop_cdm}
      CDM_SCHEMA: ${CDM_SCHEMA:-cdm}
      VOCAB_SCHEMA: ${VOCAB_SCHEMA:-cdm}
      RESULTS_SCHEMA: ${RESULTS_SCHEMA:-results}
      RESULTS_DIR: ${RESULTS_DIR}
      CDM_SOURCE_NAME: ${CDM_SOURCE_NAME}

      SHINY_HOST: ${SHINY_HOST:-0.0.0.0}
      SHINY_PORT: ${SHINY_PORT:-3000}
      SHINY_BASE_PATH: /dqd
    depends_on:
      omop-bridge-db:
        condition: service_healthy
    volumes:
      - dqd_results:/results
    networks:
      - omop-bridge-network

  ares:
    image: nginx:alpine
    container_name: omop-bridge-ares
    restart: unless-stopped
    volumes:
      - dqd_results:/usr/share/nginx/html/data
    networks:
      - omop-bridge-network

  frontend:
    image: ${FRONTEND_IMAGE:-omop-bridge-frontend:local}
    container_name: omop-bridge-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ""
    depends_on:
      - backend
    networks:
      - omop-bridge-network

  atlas3-webapi:
    image: ${WEBAPI_IMAGE:-atlas3-webapi:local}
    container_name: omop-bridge-atlas3-webapi
    platform: linux/amd64
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/WebAPI/info || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      DATASOURCE_URL: jdbc:postgresql://omop-bridge-db:5432/omop_cdm?currentSchema=webapi
      DATASOURCE_USERNAME: omop
      DATASOURCE_PASSWORD: omop
      DATASOURCE_OHDSI_SCHEMA: webapi
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: webapi
      SPRING_BATCH_REPOSITORY_TABLEPREFIX: webapi.batch_
      FLYWAY_DATASOURCE_USERNAME: omop
      FLYWAY_DATASOURCE_PASSWORD: omop
      SPRING_FLYWAY_URL: jdbc:postgresql://omop-bridge-db:5432/omop_cdm?currentSchema=webapi
      SPRING_FLYWAY_USER: omop
      SPRING_FLYWAY_PASSWORD: omop
      SPRING_FLYWAY_SCHEMAS: webapi
      SPRING_FLYWAY_TABLE: flyway_schema_history
      SPRING_FLYWAY_BASELINE_VERSION: "3.0.0"
      SPRING_FLYWAY_PLACEHOLDERS_OHDSISCHEMA: webapi
      FLYWAY_BASELINE_VERSION: "3.0.0"
      SPRING_FLYWAY_REPAIR_ON_MIGRATE: true
      SECURITY_CORS_ENABLED: "true"
      SECURITY_CORS_ALLOWED_ORIGINS: "http://localhost,https://localhost"
      SECURITY_AUTH_DB_ENABLED: "true"
      SECURITY_AUTH_WINDOWS_ENABLED: "false"
      SECURITY_AUTH_KERBEROS_ENABLED: "false"
      SECURITY_AUTH_OIDC_ENABLED: "false"
      SECURITY_AUTH_OAUTH_FACEBOOK_ENABLED: "false"
      SECURITY_AUTH_OAUTH_GITHUB_ENABLED: "false"
      SECURITY_AUTH_OAUTH_GOOGLE_ENABLED: "false"
      SECURITY_AUTH_LDAP_ENABLED: "false"
      SECURITY_AUTH_AD_ENABLED: "false"
      SECURITY_AUTH_CAS_ENABLED: "false"
      SECURITY_AUTH_OAUTH_CALLBACK_UI: "http://localhost/atlas/#/oauth/callback"
      SECURITY_AUTH_OAUTH_CALLBACK_API: "http://localhost:8080/WebAPI/user/oauth/callback"
      SECURITY_AUTH_DB_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SECURITY_AUTH_DB_DATASOURCE_URL: jdbc:postgresql://omop-bridge-db:5432/omop_cdm?currentSchema=webapi
      SECURITY_AUTH_DB_DATASOURCE_USERNAME: omop
      SECURITY_AUTH_DB_DATASOURCE_PASSWORD: omop
      SECURITY_AUTH_DB_DATASOURCE_SCHEMA: webapi
      TREXSQL_ENABLED: "true"
      TREXSQL_CACHE_PATH: /data/cache
      HOME: /data
      AWS_REGION: us-east-1
      BAO_AGENT_MODEL: ${BAO_AGENT_MODEL:-minimax.minimax-m2.5}
    env_file:
      - .env
    volumes:
      - atlas3-webapi-data:/data
    depends_on:
      omop-bridge-db:
        condition: service_healthy
    networks:
      - omop-bridge-network

  webapi-init:
    image: postgres:16-alpine
    container_name: omop-bridge-webapi-init
    depends_on:
      atlas3-webapi:
        condition: service_healthy
    volumes:
      - ./post-webapi-ddl:/scripts
    command: >
      sh -c "echo 'WebAPI is up and healthy. Executing post-startup SQL scripts from /scripts...' &&
             until pg_isready -h omop-bridge-db -p 5432 -U omop; do sleep 2; done &&
             for f in /scripts/*.sql; do
               if [ -f \"$$f\" ]; then
                 echo 'Running script: $$f' &&
                 psql postgresql://omop:omop@omop-bridge-db:5432/omop_cdm -f \"$$f\" || exit 1;
               fi;
             done &&
             echo 'All post-webapi-ddl scripts executed successfully!'"
    networks:
      - omop-bridge-network

  atlas3-frontend:
    image: abertnamanya/atlas3-frontend:latest
    container_name: omop-bridge-atlas3-frontend
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - atlas3-caddy-data:/data
    environment:
      WEBAPI_URL: ${WEBAPI_URL:-https://localhost/WebAPI}
      CADDY_HOSTNAME: ${CADDY_HOSTNAME:-localhost}
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-}
    depends_on:
      atlas3-webapi:
        condition: service_healthy
    networks:
      - omop-bridge-network

  nginx:
    image: nginx:alpine
    container_name: omop-bridge-nginx
    restart: unless-stopped
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend
    networks:
      - omop-bridge-network

  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - SUB_PATH=/db
    volumes:
      - dbgate_data:/home/dbgate
    networks:
      - omop-bridge-network

  loki:
    image: grafana/loki:latest
    container_name: omop-bridge-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - omop-bridge-network

  promtail:
    image: grafana/promtail:latest
    container_name: omop-bridge-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./grafana/promtail-config.yaml:/etc/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - omop-bridge-network

  prometheus:
    image: prom/prometheus:latest
    container_name: omop-bridge-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - omop-bridge-network

  grafana:
    image: grafana/grafana:latest
    container_name: omop-bridge-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_DEFAULT_HOME_DASHBOARD_UID=omop-bridge-infra
    depends_on:
      - loki
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - omop-bridge-network

volumes:
  omopbridge_db_data:
  uploads:
  dqd_results:
  atlas3-webapi-data:
    name: atlas3-webapi-data
  atlas3-caddy-data:
    name: atlas3-caddy-data
  frontend_node_modules:
  grafana_data:
  dbgate_data:

networks:
  omop-bridge-network:
    name: omop-bridge-network
    driver: bridge